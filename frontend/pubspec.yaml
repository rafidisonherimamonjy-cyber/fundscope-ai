name: fundscope_ai
description: "FundScope AI — Assistant intelligent de recherche de financements et d'appels à projets."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # État / architecture
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Réseau
  dio: ^5.5.0

  # Stockage local sécurisé (token JWT)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Notifications push
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  # UI / utilitaires
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
