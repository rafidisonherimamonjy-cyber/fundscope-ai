name: Build & Release Android APK

# Ce workflow compile l'application Flutter en APK Android et le publie
# automatiquement en tant que "Release" GitHub, ce qui fournit un lien de
# téléchargement direct et stable (aucune installation locale de Flutter
# n'est nécessaire : tout se passe dans le cloud GitHub Actions).
#
# Déclenchement :
#   - manuellement, depuis l'onglet "Actions" du dépôt (bouton "Run workflow"),
#     en renseignant éventuellement l'URL de votre backend ;
#   - automatiquement à chaque push sur "main" qui modifie le dossier frontend/.

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL de base de l'API backend (ex: https://mon-api.example.com/api/v1)"
        required: false
        default: "https://api.fundscope.example.com/api/v1"
      verify_backend_url:
        description: "(Optionnel) Renseignez cette URL (ex: https://fundscope-api-cvrg.onrender.com, SANS /api/v1) pour uniquement vérifier que le backend déployé répond, au lieu de compiler l'APK. Laissez vide pour un build normal."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write  # nécessaire pour que le workflow puisse publier une Release avec l'APK en pièce jointe

jobs:
  verify-backend:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.verify_backend_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier /health
        run: |
          set -e
          BASE="${{ github.event.inputs.verify_backend_url }}"
          echo "GET $BASE/health"
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 60 "$BASE/health")
          cat /tmp/health.json; echo
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::/health n'a pas répondu 200 (service endormi/down ?)"; exit 1; }

      - name: Test inscription + connexion (confirme le fix bcrypt/passlib)
        run: |
          set -e
          BASE="${{ github.event.inputs.verify_backend_url }}"
          EMAIL="ci-verify-$(date +%s)@example.com"

          # Récupère un country_id réellement présent en base plutôt que de
          # supposer que l'id 1 existe (dépend de l'ordre/contenu du seed).
          curl -s --max-time 30 "$BASE/api/v1/reference/countries" -o /tmp/countries.json
          echo "Pays disponibles :"; cat /tmp/countries.json; echo
          COUNTRY_ID=$(python3 -c "import json;print(json.load(open('/tmp/countries.json'))[0]['id'])" 2>/dev/null || echo "")
          if [ -z "$COUNTRY_ID" ]; then
            echo "::error::Impossible de récupérer un country_id valide — la table 'countries' est-elle vide (seed non exécuté) ?"
            exit 1
          fi
          echo "Utilisation de country_id=$COUNTRY_ID"

          REG=$(curl -s -o /tmp/register.json -w "%{http_code}" --max-time 30 -X POST "$BASE/api/v1/auth/register" \
            -H "Content-Type: application/json" \
            -d "{\"full_name\":\"CI Verify\",\"email\":\"$EMAIL\",\"password\":\"Passw0rd!\",\"organization_name\":\"CI Org\",\"country_id\":$COUNTRY_ID}")
          echo "HTTP inscription: $REG"; cat /tmp/register.json; echo
          [ "$REG" = "200" ] || [ "$REG" = "201" ] || { echo "::error::Inscription échouée (HTTP $REG)"; exit 1; }

          LOGIN=$(curl -s -o /tmp/login.json -w "%{http_code}" --max-time 30 -X POST "$BASE/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"Passw0rd!\"}")
          echo "HTTP connexion: $LOGIN"; cat /tmp/login.json; echo
          [ "$LOGIN" = "200" ] || { echo "::error::Connexion échouée (HTTP $LOGIN) — backend pas encore redéployé avec le fix ?"; exit 1; }
          echo "✅ Inscription + connexion OK."

      - name: Vérifier les données de démonstration (seed)
        run: |
          TOKEN=$(python3 -c "import json;print(json.load(open('/tmp/login.json'))['access_token'])")
          BASE="${{ github.event.inputs.verify_backend_url }}"
          curl -s -o /tmp/opps.json -w "HTTP opportunities: %{http_code}\n" --max-time 30 "$BASE/api/v1/opportunities" -H "Authorization: Bearer $TOKEN"
          COUNT=$(python3 -c "import json;print(len(json.load(open('/tmp/opps.json'))))" 2>/dev/null || echo "N/A")
          echo "Nombre d'appels à projets : $COUNT"
          [ "$COUNT" != "0" ] && [ "$COUNT" != "N/A" ] || echo "::warning::Aucune opportunité — as-tu lancé 'python -m app.seed.seed_data' sur Render ?"

  build-and-release:
    if: github.event_name == 'push' || github.event.inputs.verify_backend_url == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Java (requis par Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurer le SDK Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Générer les dossiers natifs Android (android/)
        run: flutter create . --platforms=android --org com.fundscope

      - name: Installer les dépendances Dart
        run: flutter pub get

      - name: Déterminer l'URL de l'API à utiliser dans le build
        id: api_url
        run: |
          echo "value=${{ github.event.inputs.api_base_url || 'https://api.fundscope.example.com/api/v1' }}" >> "$GITHUB_OUTPUT"

      - name: Compiler l'APK (release)
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ steps.api_url.outputs.value }}

      - name: Préparer le fichier APK à publier
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/fundscope-ai-${{ github.run_number }}.apk

      - name: Publier une Release GitHub avec l'APK en pièce jointe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "FundScope AI — build ${{ github.run_number }}"
          body: |
            APK généré automatiquement par GitHub Actions.

            **URL de l'API configurée pour ce build :** `${{ steps.api_url.outputs.value }}`

            ⚠️ Cet APK est signé avec une clé de debug (suffisant pour tester en sideload).
            Pour une publication sur le Play Store, configurez une vraie clé de signature
            (voir frontend/README.md).
          files: dist/fundscope-ai-${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier aussi comme artefact du run (accès rapide sans Release)
        uses: actions/upload-artifact@v4
        with:
          name: fundscope-ai-apk
          path: dist/fundscope-ai-${{ github.run_number }}.apk
